<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Logarithmic Solar System — real astronomical data compressed with logarithmic scaling. Select a planet or moon to inspect it."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Logarithmic Solar System</title>
  </head>
  <body>
    <div id="app">
      <!-- Top-left heading + simulation clock -->
      <header class="hud-header">
        <a class="hud-brand" href="#info-panel" aria-label="태양계 시뮬레이션으로 돌아가기">
          <h1>태양계 <span class="hud-en">Logarithmic Solar System</span></h1>
        </a>
        <p id="hud-date" class="hud-date" aria-live="off">시뮬레이션 0일</p>
      </header>

      <!-- Selected-body info panel -->
      <aside
        id="info-panel"
        class="info-panel empty"
        role="region"
        aria-label="선택된 천체 정보"
      >
        <p id="info-empty" class="info-empty">천체를 선택하면 정보를 표시합니다.<br />천체를 클릭하거나 ▲▼ / Tab 키로 이동하세요.</p>
        <div class="info-header-row">
          <span id="info-swatch" class="info-swatch" aria-hidden="true"></span>
          <h2 id="info-title-ko" class="info-title"></h2>
          <span id="info-type" class="info-type"></span>
        </div>
        <div id="info-title-en" class="info-title-en"></div>
        <dl id="info-list" class="info-list"></dl>
        <section class="info-moons" aria-label="위성 목록">
          <h3 class="info-moons-title">위성 (Moons)</h3>
          <ul id="info-moons-list" class="info-moons-list"></ul>
          <p id="info-moons-empty" class="info-moons-empty" hidden>
            이 천체에는 위성이 없습니다.
          </p>
        </section>
        <p id="info-desc" class="info-desc"></p>
      </aside>

      <!-- Hover tooltip overlay (pointer-events: none; never affects selection) -->
      <div id="hover-tooltip" class="hover-tooltip" hidden>
        <span id="hover-tooltip-name" class="hover-tooltip-name"></span>
        <span id="hover-tooltip-en" class="hover-tooltip-en"></span>
        <span id="hover-tooltip-type" class="hover-tooltip-type"></span>
      </div>

      <!-- Required visible scale disclaimer (§14): the scene does not use one
           physical scale — distances and sizes are mode-dependent. Rolled into
           the HUD group so Hide/Show Panels folds it away with the rest. -->
      <div id="scale-disclaimer" class="scale-disclaimer" role="note">
        <span class="scale-disclaimer-badge">스케일 주의</span>
        <span class="scale-disclaimer-text">
          거리·크기는 실제 비율이 아니며, 선택한 모드(로그·선형·포커스 거리 /
          강화·상대·균일 크기)에 따라 화면상 배치가 달라집니다.
        </span>
      </div>

      <!-- Bottom control bar -->
      <nav class="control-bar" aria-label="시뮬레이션 제어">
        <div class="ctrl-group ctrl-group-play">
          <button id="ctrl-play" class="ctrl-btn play" aria-pressed="true" title="일시정지">
            ⏸ 일시정지
          </button>
        </div>

        <div class="ctrl-group" role="group" aria-label="속도">
          <span class="ctrl-label">속도</span>
          <button id="speed-down" class="ctrl-btn icon" aria-label="속도 낮추기">−</button>
          <span id="speed-value" class="speed-value">1×</span>
          <button id="speed-up" class="ctrl-btn icon" aria-label="속도 높이기">+</button>
          <button id="speed-reset" class="ctrl-btn" aria-label="시간과 속도 초기화">초기화</button>
        </div>

        <div class="ctrl-group ctrl-group-list">
          <label class="ctrl-label" for="dist-mode">거리</label>
          <select id="dist-mode" class="ctrl-select" aria-label="거리 스케일 모드">
            <option value="log">로그</option>
            <option value="linear">선형</option>
            <option value="focus">포커스</option>
          </select>
        </div>

        <div class="ctrl-group ctrl-group-list">
          <label class="ctrl-label" for="size-mode">크기</label>
          <select id="size-mode" class="ctrl-select" aria-label="천체 크기 모드">
            <option value="enhanced">강화</option>
            <option value="relative">상대</option>
            <option value="uniform">균일</option>
          </select>
        </div>

        <div class="ctrl-group">
          <button
            id="ctrl-orbits"
            class="ctrl-btn"
            aria-pressed="true"
            title="궤도 표시/숨기기"
          >
            궤도 숨기기
          </button>
        </div>

        <div class="ctrl-group">
          <button
            id="ctrl-moons"
            class="ctrl-btn"
            aria-pressed="true"
            title="위성 표시/숨기기"
          >
            위성 숨기기
          </button>
        </div>

        <div class="ctrl-group">
          <button
            id="ctrl-stars"
            class="ctrl-btn"
            aria-pressed="true"
            title="별 필드 표시/숨기기"
          >
            별 숨기기
          </button>
        </div>

        <div class="ctrl-group">
          <button id="ctrl-labels" class="ctrl-btn" aria-pressed="true" title="이름표 표시/숨기기">
            ✕ 레이블 숨기기
          </button>
        </div>

        <div class="ctrl-group">
          <button
            id="ctrl-panels"
            class="ctrl-btn"
            aria-pressed="true"
            title="패널 숨기기"
          >
            패널 숨기기
          </button>
        </div>

        <div class="ctrl-group ctrl-group-focus">
          <span class="ctrl-label">이동</span>
          <button id="focus-prev" class="ctrl-btn icon" aria-label="이전 천체">▲</button>
          <select id="body-select" aria-label="이동할 천체 선택"></select>
          <button id="focus-next" class="ctrl-btn icon" aria-label="다음 천체">▼</button>
          <button id="ctrl-home" class="ctrl-btn" title="시작 화면(태양 중심)으로">
            홈
          </button>
        </div>
      </nav>

      <!-- Persistent affordance to restore the HUD after it is hidden.
           Sits OUTSIDE the hidden group (its own high z-index, own element),
           so it can never be hidden with the rest of the HUD. -->
      <button
        id="show-panels"
        class="show-panels-btn"
        hidden
        aria-label="패널 표시"
        title="패널 표시"
      >
        ☰ 패널 표시
      </button>

      <!-- Screen-reader live region for selection/simulation announcements -->
      <div id="status" class="sr-only" role="status" aria-live="polite"></div>

      <!-- Keyboard hint (decorative, always visible on wide screens) -->
      <p class="kb-hint" aria-hidden="true">
        클릭: 선택 · ▲▼/Tab: 이동 · Space: 재생/일시정지 · Esc: 해제 · 드래그: 회전 · 휠: 확대/축소
      </p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
